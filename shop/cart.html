<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>კალათის მართვა — STEP Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">S</span>
        <span>STEP Store<span class="logo__sub"> · ონლაინ მაღაზია</span></span>
      </a>

      <form class="search" id="searchForm" role="search" action="index.html" method="get">
        <span class="search__icon">🔍</span>
        <input type="search" name="q" placeholder="მოძებნე ნივთი სახელწოდებით…" autocomplete="off" />
      </form>

      <div class="header__actions">
        <button class="icon-btn" data-auth-btn type="button">
          <span>👤</span><span data-auth-label>შესვლა</span>
        </button>
        <a class="icon-btn icon-btn--cart" href="cart.html" data-active="true" title="კალათა">
          <span>🛒</span>
          <span class="badge is-empty" data-cart-count>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>კალათის მართვა</h1>
        <p id="cartSummaryLine">იტვირთება…</p>
      </div>
      <button class="btn btn--ghost btn--sm" id="clearCart">კალათის გასუფთავება</button>
    </div>

    <div class="cart-layout">
      <section id="cartList">
        <div class="skeleton" style="height:128px;border-radius:14px;margin-bottom:14px"></div>
        <div class="skeleton" style="height:128px;border-radius:14px;margin-bottom:14px"></div>
      </section>

      <aside class="summary" id="summaryBox">
        <h3>შეკვეთის ჯამი</h3>
        <div class="summary__row"><span>ნივთები</span><span id="sumItems">—</span></div>
        <div class="summary__row"><span>ფასდაკლებამდე</span><span id="sumBefore">—</span></div>
        <div class="summary__row"><span>ფასდაკლება</span><span id="sumDiscount">—</span></div>
        <div class="summary__row summary__row--total"><span>ჯამი</span><span id="sumTotal">—</span></div>
        <button class="btn btn--primary btn--block" id="checkoutBtn">შეკვეთის გაფორმება</button>
        <a class="btn btn--ghost btn--block" href="index.html" style="margin-top:8px">შოპინგის გაგრძელება</a>
        <p class="summary__note" id="summaryNote"></p>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span><small>ლოკალური კატალოგი სადემონსტრაციოა: ფასები, მარაგი და შეფასებები პირობითია.</small></span>
      <span>კატალოგი: პროცესორები და ვიდეოდაფები</span>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/local-products.js"></script>
  <script src="js/cart-service.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
