<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>STEP Store — ონლაინ მაღაზია</title>
  <meta name="description" content="ონლაინ მაღაზია EverREST API-ზე: ფილტრაცია, ძიება, კალათა და შეფასებები." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ====== HEADER ====== -->
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="index.html">
        <span class="logo__mark">S</span>
        <span>STEP Store<span class="logo__sub"> · ონლაინ მაღაზია</span></span>
      </a>

      <!-- ძიება ნივთის სახელწოდებით -->
      <form class="search" id="searchForm" role="search">
        <span class="search__icon">🔍</span>
        <input type="search" id="searchInput" name="keywords" placeholder="მოძებნე ნივთი სახელწოდებით…" autocomplete="off" />
        <button class="search__clear is-hidden" type="button" id="searchClear" aria-label="გასუფთავება">&times;</button>
      </form>

      <div class="header__actions">
        <button class="icon-btn filter-toggle" data-filter-toggle type="button">
          <span>⚙︎</span><span>ფილტრი</span>
        </button>

        <button class="icon-btn" data-auth-btn type="button">
          <span>👤</span><span data-auth-label>შესვლა</span>
        </button>

        <!-- კალათის აიკონი -->
        <a class="icon-btn icon-btn--cart" href="cart.html" title="კალათა">
          <span>🛒</span>
          <span class="badge is-empty" data-cart-count>0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>ყველა ნივთი</h1>
        <p id="resultSummary">იტვირთება…</p>
      </div>
      <div class="toolbar__spacer"></div>
      <label class="toolbar">
        <span class="toolbar__count">დალაგება:</span>
        <select class="select" id="sortSelect">
          <option value="">ნაგულისხმევი</option>
          <option value="price:asc">ფასი — ზრდადი</option>
          <option value="price:desc">ფასი — კლებადი</option>
          <option value="rating:desc">რეიტინგი — მაღალი</option>
          <option value="title:asc">სახელი — ა-ჰ</option>
        </select>
      </label>
    </div>

    <div class="layout">
      <!-- ====== FILTERS ====== -->
      <aside class="sidebar" id="sidebar">
        <!-- მონაცემთა წყაროს გადამრთველი დამალულია: ნაჩვენებია მხოლოდ ლოკალური
             კატალოგი. API-ის რეჟიმი რჩება კოდში და იხსნება ბმულით ?source=api -->
        <div id="sourceFilter" class="is-hidden">
          <label class="check"><input type="radio" name="source" value="local" checked /> კომპიუტერის ნაწილები</label>
          <label class="check"><input type="radio" name="source" value="api" /> EverREST API</label>
        </div>

        <div class="filter-group">
          <div class="filter-group__title">კატეგორია</div>
          <div class="scroll-box" id="categoryFilter">
            <div class="skeleton" style="height:18px;margin:8px 0"></div>
            <div class="skeleton" style="height:18px;margin:8px 0"></div>
            <div class="skeleton" style="height:18px;margin:8px 0"></div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group__title">ბრენდი</div>
          <div class="scroll-box" id="brandFilter">
            <div class="skeleton" style="height:18px;margin:8px 0"></div>
            <div class="skeleton" style="height:18px;margin:8px 0"></div>
            <div class="skeleton" style="height:18px;margin:8px 0"></div>
          </div>
        </div>

        <div class="filter-group">
          <div class="filter-group__title">ფასი</div>
          <div class="price-row">
            <input type="number" id="priceMin" placeholder="მინ." min="0" />
            <span>—</span>
            <input type="number" id="priceMax" placeholder="მაქს." min="0" />
          </div>
          <button class="btn btn--ghost btn--sm btn--block" id="priceApply" style="margin-top:10px">გაფილტვრა</button>
        </div>

        <div class="filter-group rating-filter">
          <div class="filter-group__title">რეიტინგი</div>
          <div id="ratingFilter"></div>
        </div>

        <button class="btn btn--ghost btn--block" id="resetFilters">ფილტრების გასუფთავება</button>
      </aside>

      <!-- ====== PRODUCTS ====== -->
      <section>
        <div class="toolbar">
          <div class="chips" id="activeChips"></div>
        </div>

        <div class="grid" id="productGrid"></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span><small>ლოკალური კატალოგი სადემონსტრაციოა: ფასები, მარაგი და შეფასებები პირობითია.</small></span>
      <span>კატალოგი: პროცესორები და ვიდეოდაფები</span>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/local-products.js"></script>
  <script src="js/cart-service.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
